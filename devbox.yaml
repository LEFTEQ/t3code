project: t3code

resources:
  workspace: standard
  test: medium
  memory: 4G

apps:
  server:
    run_in: source
    cmd: >-
      export PATH="$HOME/.bun/bin:$PATH";
      exec mise exec node@24.20.0 -- node apps/server/src/bin.ts --host 0.0.0.0 --port {port:server} --base-dir {state}/t3 --no-browser --auto-bootstrap-project-from-cwd
    build: mise exec node@24.20.0 -- node_modules/.bin/vp run --filter @t3tools/web build
    ports: [server]
  source:
    source_only: true
    sync: .
    provision: >-
      mise exec node@24.20.0 -- corepack pnpm install --frozen-lockfile &&
      mise exec node@24.20.0 -- node_modules/.bin/vp run --filter @t3tools/web build
    deps:
      key:
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - apps/*/package.json
        - infra/*/package.json
        - packages/*/package.json
        - oxlint-plugin-t3code/package.json
        - scripts/package.json
      cmd: mise exec node@24.20.0 -- corepack pnpm install --frozen-lockfile
      profile: medium
    sync_ignores:
      - .env
      - .env.*
      - .t3
      - .repos
      - release
