# yaml-language-server: $schema=https://raw.githubusercontent.com/henderson-tech/devbox-schema/main/v2/devbox.schema.json
version: 2
project: t3code
resources:
  workspace: standard
  test: medium
  memory: 2G
checkouts:
  source:
    from: .
    provision: [mise install gh@2.101.0, mise exec node@24.20.0 -- corepack pnpm install --frozen-lockfile, mise exec node@24.20.0 -- node_modules/.bin/vp run --filter @t3tools/web build]
    deps:
      - key:
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - package.json
          - apps/*/package.json
          - infra/*/package.json
          - packages/*/package.json
          - oxlint-plugin-t3code/package.json
          - scripts/package.json
        cmd: mise exec node@24.20.0 -- corepack pnpm install --frozen-lockfile
        size: medium
    sync_ignores:
      - .env
      - .env.*
      - .t3
      - .repos
      - release
apps:
  server:
    in: source
    cmd: >-
      export PATH="$HOME/.bun/bin:$PATH"; exec mise exec node@24.20.0 gh@2.101.0 -- node apps/server/src/bin.ts --host 0.0.0.0 --port {port:server} --base-dir {state}/t3 --no-browser --auto-bootstrap-project-from-cwd
    build: [mise exec node@24.20.0 -- node_modules/.bin/vp run --filter @t3tools/web build]
    ports: [server]
    ready: none
